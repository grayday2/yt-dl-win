; ytm-dl settings (portable). Format: key=value, one per line, ; starts a comment.
; If the window closes instantly: ytm.bat report (or open ytm-dl-log.txt here) - the
; "last: <stage>" line says how far the launcher got. The file is (re)written on every run.
; Relative paths are resolved next to this folder (where ytm.bat lives).

out=music
port=8765
; none = flat "Artist - Title.m4a";  album = subfolder per album
organize=none
; optional shared secret; if set, type the same string in the panel field "token"
token=
; recommended for playlists/"liked songs": chrome | firefox | edge | brave | opera
; (needs a YouTube Music profile logged in in that browser)
cookies_from_browser=
; FIREFOX - the easy case: it does NOT encrypt its cookie store, so just set
;   cookies_from_browser=firefox   and close firefox while the engine starts (an open
;   profile is locked: "database is locked"). Wait for the banner in the window, then
;   reopen firefox - the cookies have already been read.
; PORTABLE FIREFOX (PortableApps, e.g. U:\soft\...\FirefoxPortable): the packaged
; yt-dlp looks ONLY in %APPDATA%\Mozilla\Firefox\Profiles, so a bare "firefox" finds
; nothing there. Give it the profile path (Data\profile, NOT App\Firefox64):
;   cookies_from_browser=firefox:U:\soft\PAP1\PortableApps\FirefoxPortable\Data\profile
; Any folder that contains cookies.sqlite works, and ytm.bat selftest (option 4)
; will print the exact path it found. If firefox shows those logins in a CONTAINER,
; append it:  firefox:<path>::containerName   (or ::none for "no container").
; If you would rather not fight the path: export cookies.txt (see below) - profile
; location is then irrelevant.
; CHROMIUM (chrome/edge/brave/opera/vivaldi): since Chrome 127 their cookie store is
; app-bound encrypted, so cookies_from_browser often dies with "Failed to decrypt with
; DPAPI". There the file is the way: logged-in music.youtube.com tab -> extension
; "Get cookies.txt LOCALLY" -> Export -> save as cookies.txt IN THIS FOLDER ->
; cookies_file=cookies.txt below. Either way: ytm.bat selftest -> "cookies" must be [ok].
; TIP: you do NOT have to write the key at all - a cookies.txt lying NEXT TO ytm.bat
; (or in the output folder) is picked up automatically at engine start; the banner and
; selftest then say "cookies.txt (auto)" so you can see it was really applied.
; cookies_from_browser still wins when set, and an explicit cookies_file in this ini
; always overrides the automatic pick-up.
; optional: force a specific yt-dlp youtube client. empty = the built-in ladder, which
; now starts with web_safari (that client always lists m4a/aac, so you get a real cover
; and no po-token trouble); only after it come: yt-dlp default, tv, web_embedded and
; web_safari+missing_pot. A single hard failure is retried through all of them - which
; is exactly why "auto" used to look broken on one track while your browser played it.
; "tv" needs NO po-token (fewer formats, but no bot-check).
; PLAYLISTS since 0.5.0: you do NOT need tv here anymore. The userscript stopped
; forcing it, the old "player_client=tv" string never even reached yt-dlp (its API
; wants a dict - strings were silently ignored, so lists always ran on web and got
; "The page needs to be reloaded"), and now a list where NOTHING downloaded is
; re-tried on web_safari + formats=missing_pot, then web_embedded. Set tv only to
; pin it first; the ladder still follows.
player_client=
cookies_file=
; ===== если ты в VPN / прокси (например FoxyProxy: socks5://127.0.0.1:10808) =====
; YouTube привязывает ссылку на поток к IP, с которого её выдал. Если браузер в
; прокси, а yt-dlp ходит напрямую - 403/бот-чек на ровном месте. Сюда вписывают
; ровно тот же вход, которым пользуется браузер:
;   proxy=socks5://127.0.0.1:10808
; SOCKS5 можно прямо так: yt-dlp умеет его сам (yt_dlp/socks.py), а собственным
; запросам компаньона (обложка, thumbnail) нужен PySocks - он ЕДЕТ В АРХИВЕ
; (wheels\PySocks-1.7.1) и ставится install-packages-offline.bat / setup.ps1.
; http-вход того же клиента тоже принимается: Clash/Mihomo 7890, v2rayN 10809, Surge 6152.
; Через proxy= ходят ВСЕ внешние запросы: yt-dlp в режимах url/browser/playlist и сам
; компаньон (yt3.googleusercontent.com без прокси из РФ обычно не открывается).
; Пустое поле - это тоже нормально: компаньон читает системный прокси (WinINET - его же
; слушает Firefox в режиме «системный прокси»), проверяет, что порт отвечает, и наследует.
; Если VPN поднимает интерфейс на весь компьютер (WireGuard/Outline/TUN), так и надо:
; лишний proxy= = «VPN через VPN», иногда петля.
; Проверка: ytm.bat selftest -> строка "proxy (чем ходит yt-dlp)" (она же покажет,
; унаследовано значение из ini или из системы).
proxy=
; proxy=none (или off/direct/0) - КАЧАТЬ НАПРЯМУЮ: не брать ни строку отсюда, ни
; системный прокси Windows. Режим «сел на чужом ноуте без VPN - и работает».
; «0» работает и здесь, и в панели Tampermonkey: 0 = не пользоваться НИЧЕМ, даже
; системным прокси (случай «VPN в TUN-режиме» - лишний прокси только вредит).
; В панели Tampermonkey есть такое же поле proxy: что в панели - то и для этой закачки.

; ===== convert / verify (0.5.2) =====
; convert=m4a|mp3|opus - принудительная упаковка ГОТОВОГО файла: страховка, когда
; «качалось нормально, а в плеере телефона не играет». Пусто = как выбран в панели.
; Явный copy в панели неприкосновенен: force его не перебивает (copy = сырые байты).
convert=
; impersonate - TLS/HTTP2-отпечаток запросов yt-dlp (curl_cffi).
; auto = chrome, если колесо curl-cffi установлено (в поставке ставится само);
; off = не трогать (как в 0.5.5); явная цель (edge-130...) - передается как есть.
impersonate=
; verify=0 - выключить проверку готового файла декодированием (ffmpeg -xerror +
; сверку длительности). По умолчанию включена: «файл есть, а plays нет» больше не
; отдаётся молча - кривой поток companion ловит сам и пишет в лог почему.
verify=

; ===== ytm-dl.json (0.5.2) =====
; Тот же набор ключей лежит в ytm-dl.json рядом с ytm.bat (см. ytm-dl.example.json)
; - для тех, кому Блокнот удобнее, чем «ключ=значение» без кавычек. Если ytm-dl.json
; существует, он ВАЖНЕЕ этого ini. Ключи: out, port, token, organize, proxy,
; player_client, cookies_from_browser, cookies_file, convert, verify, impersonate.
